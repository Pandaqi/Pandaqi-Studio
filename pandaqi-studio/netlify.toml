[build]
  publish = "public"
  command = """\
  curl -LJO https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && \
  tar -xf dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && \
  rm dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && \
  export PATH=/opt/build/repo/dart-sass:$PATH && \
  hugo --gc --minify --cleanDestinationDir \
  """

  [build.environment]
    HUGO_VERSION = "0.153.4"
    DART_SASS_VERSION = "1.70.0"

[context.production.environment]
  HUGO_ENV           = "production"
  HUGO_ENABLEGITINFO = "true"

[context.split1]
  command = "hugo --gc --minify --enableGitInfo --cleanDestinationDir"

  [context.split1.environment]
    HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL --cleanDestinationDir"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL --cleanDestinationDir"

[context.next.environment]
  HUGO_ENABLEGITINFO = "true"

[[redirects]]
  from   = "/npmjs/*"
  to     = "/npmjs/"
  status = 200

# Fingerprinted CSS never changes name, so it can be cached for a year.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Library files carry a content hash now, but the folder also holds plain static files, so it keeps a
# short cache rather than a year.
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Bundles and page stylesheets under /games/ are fingerprinted; the images and HTML beside them are not,
# so a day is the safe ceiling here.
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Theme artwork and fonts keep stable names.
[[headers]]
  for = "/theme/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"